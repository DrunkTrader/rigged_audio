appId: com.riggedaudio.desktop
productName: Rigged Audio
directories:
  output: release
  buildResources: build
files:
  - dist/**
  - dist-electron/**
  - "!dist-electron/**/*.test.js"
  - "!dist-electron/**/test-helper.js"
  # Window and taskbar icon at runtime (main.ts).
  - assets/icon.png
extraResources:
  - from: python
    to: python
    filter:
      - "*.py"
asar: true
mac:
  target:
    - dmg
    - zip
  category: public.app-category.music
  # One 1024 px PNG; electron-builder makes the .icns and .ico from it.
  icon: assets/icon.png
  artifactName: Rigged-Audio-${version}-macOS-${arch}.${ext}
win:
  icon: assets/icon.png
  target:
    - portable
    - zip
  artifactName: Rigged-Audio-${version}-Windows-${arch}.${ext}
linux:
  icon: assets/icon.png
  target:
    - AppImage
    - deb
  category: AudioVideo
  syncDesktopName: true
  artifactName: Rigged-Audio-${version}-Linux-${arch}.${ext}
