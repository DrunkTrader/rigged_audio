appId: com.riggedaudio.desktop
productName: Rigged Audio
directories:
  output: release
  buildResources: build
files:
  - dist/**
  - dist-electron/**
  - "!dist-electron/**/*.test.js"
  - "!dist-electron/**/test-helper.js"
  # Window and taskbar icon at runtime (main.ts).
  - assets/icon.png
extraResources:
  - from: python
    to: python
    filter:
      - "*.py"
asar: true
# Releases are published by .github/workflows/release.yml, never by electron-builder itself.
publish: null
mac:
  target:
    - dmg
    - zip
  category: public.app-category.music
  # One 1024 px PNG; electron-builder makes the .icns and .ico from it.
  icon: assets/icon.png
  artifactName: Rigged-Audio-${version}-macOS-${arch}.${ext}
  # No Apple certificate yet: ad-hoc sign, so Apple Silicon shows the usual "unidentified developer"
  # prompt instead of "damaged". Ad-hoc signing needs the hardened runtime off (scheme.json).
  identity: "-"
  hardenedRuntime: false
win:
  icon: assets/icon.png
  target:
    - nsis
    - portable
nsis:
  # Assisted installer: the user picks per-user or all-users and the install folder.
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Rigged Audio
  # The library, stems and the 1-3 GB AI runtime live in %APPDATA%; upgrades and uninstalls keep them.
  deleteAppDataOnUninstall: false
  artifactName: Rigged-Audio-${version}-Windows-${arch}-Setup.${ext}
portable:
  artifactName: Rigged-Audio-${version}-Windows-${arch}-Portable.${ext}
linux:
  icon: assets/icon.png
  target:
    - AppImage
    - deb
  category: AudioVideo
  syncDesktopName: true
  maintainer: DrunkTrader <https://github.com/DrunkTrader/rigged_audio>
  artifactName: Rigged-Audio-${version}-Linux-${arch}.${ext}
deb:
  artifactName: rigged-audio_${version}_${arch}.${ext}
