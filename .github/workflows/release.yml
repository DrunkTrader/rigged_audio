name: Release

# Push a tag like v0.2.0 (matching package.json) to build every installer on native runners and
# publish a GitHub Release. "Run workflow" (workflow_dispatch) builds and uploads the same
# artifacts to the run without publishing anything.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Check version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # On a tag push, fails unless the tag is v<package.json version> and the lockfile agrees.
      - run: node scripts/check-release.mjs

  package:
    name: Package ${{ matrix.platform }}
    needs: version
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            runner: windows-latest
            command: npm run dist:win
          - platform: linux
            # The oldest supported runner, so the AppImage and .deb run on older glibc distros too.
            runner: ubuntu-22.04
            command: npm run dist:linux
          - platform: macos
            # Apple Silicon runner; builds both the arm64 and the x64 app.
            runner: macos-14
            command: npm run dist:mac
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: ${{ matrix.command }}
        env:
          # No signing certificates are configured: Windows builds are unsigned and macOS
          # builds are ad-hoc signed (electron-builder.yml). See README, "Unsigned builds".
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      # Every expected installer exists, carries the version, matches its checksum, and the
      # packaged app contains the UI, main process, icon and python/worker.py.
      - run: node scripts/check-release.mjs --artifacts ${{ matrix.platform }}
      - uses: actions/upload-artifact@v4
        with:
          name: rigged-audio-${{ matrix.platform }}
          path: |
            release/*.exe
            release/*.zip
            release/*.dmg
            release/*.AppImage
            release/*.deb
            release/SHA256SUMS-*.txt
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Combine checksums
        run: cat release/SHA256SUMS-*.txt | sort -k2 > release/SHA256SUMS.txt && cat release/SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          # v1.2.0-beta.1 style tags become pre-releases.
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          body: |
            ## Download

            | Platform | File |
            | --- | --- |
            | Windows 10/11 x64 | `Rigged-Audio-*-Windows-x64-Setup.exe` (installer) or `-Portable.exe` |
            | macOS 12+ Apple Silicon | `Rigged-Audio-*-macOS-arm64.dmg` |
            | macOS 12+ Intel | `Rigged-Audio-*-macOS-x64.dmg` |
            | Linux x64 | `Rigged-Audio-*-Linux-x86_64.AppImage` or `rigged-audio_*_amd64.deb` |

            The first launch downloads the separation engine (about 1 GB, about 3 GB with an NVIDIA GPU) and then works offline.
            These builds are not code-signed: Windows SmartScreen and macOS Gatekeeper will warn on first open (see the README for how to continue).
            Verify downloads against `SHA256SUMS.txt`.
          files: |
            release/*.exe
            release/*.zip
            release/*.dmg
            release/*.AppImage
            release/*.deb
            release/SHA256SUMS*.txt
          fail_on_unmatched_files: true
